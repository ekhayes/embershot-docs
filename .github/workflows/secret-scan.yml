# SOC 2 CHG-06 / G-26 (2026-11-25): scan every pull request's new commits for secrets.
# Uses the open-source gitleaks binary directly (no third-party action, no license key).
# A real secret fails the check: remove it, rotate it, then push again.
# A false positive: add `gitleaks:allow` as a comment on that line, or add its fingerprint to .gitleaksignore.
name: secret-scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan the commits in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then range="${BASE_SHA}..${HEAD_SHA}"; else range="HEAD~1..HEAD"; fi
          echo "Scanning $range"
          ./gitleaks git --log-opts="$range" --redact --no-banner --exit-code 1 .
